<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #059669; } a:hover { color: #047857; }
    * { box-sizing: border-box; }
    input::placeholder, textarea::placeholder { color: #94A3B8; font-weight: 500; }
    button { font-family: inherit; }
    
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F8FAFC; color: #0F172A; display: flex; flex-direction: column; overflow: hidden;">
  
  <div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(255,255,255,0.8); border-bottom: 1px solid rgba(226,232,240,0.8); backdrop-filter: blur(24px);">
    <button aria-label="Open sidebar" style="width: 36px; height: 36px; margin-left: -8px; border: 0; background: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
    <div style="flex: 1; position: relative;">
      <div style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg></div>
      <input type="search" placeholder="Search anything..." aria-label="Search" style="width: 100%; padding: 10px 16px 10px 40px; background: rgba(248,250,252,0.8); border: 1px solid #E2E8F0; border-radius: 12px; font-size: 14px; color: #334155; font-family: inherit; outline: none;" />
    </div>
    <button aria-label="Notifications" style="width: 36px; height: 36px; border: 0; background: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg></button>
    <div style="width: 36px; height: 36px; border-radius: 999px; background: #ECFDF5; color: #047857; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">A</div>
  </div>
  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;">


    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 0;">
      <button aria-label="Back to products" style="width: 40px; height: 40px; margin-left: -8px; border: 0; background: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg></button>
      <div style="flex: 1; min-width: 0;">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; color: #0F172A;">Add products</h1>
        <p style="margin: 3px 0 0; font-size: 14px; color: #64748B;">Photo, name, price. The rest can wait.</p>
      </div>
    </div>
    <div style="padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
      <div style="position: relative; width: 100%; height: 230px; border: 2px dashed #6EE7B7; background: rgba(236,253,245,0.6); border-radius: 16px;">
        <button aria-label="Take a photo" style="width: 100%; height: 100%; border: 0; background: none; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; padding: 0 16px 24px;">
          <div style="width: 68px; height: 68px; border-radius: 999px; background: #059669; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(5,150,105,0.3); flex-shrink: 0;"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A1.5 1.5 0 014.5 7h2.2l1.2-2h8.2l1.2 2h2.2A1.5 1.5 0 0121 8.5v9A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5v-9z"/><circle cx="12" cy="12.5" r="3.4"/></svg></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <div style="font-size: 18px; font-weight: 800; color: #0F172A;">Add photos</div>
            <div style="font-size: 13.5px; color: #64748B;">Take one, or choose up to 30</div>
          </div>
        </button>
        <button aria-label="Choose from gallery" style="position: absolute; right: 12px; bottom: 12px; height: 40px; padding: 0 14px 0 12px; border: 1.5px solid #E2E8F0; border-radius: 999px; background: #FFFFFF; color: #0F172A; font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.06);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25z"/></svg><span>Gallery</span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 2px 4px;"><div style="flex: 1; height: 1px; background: #E2E8F0;"></div><div style="font-size: 13px; font-weight: 600; color: #94A3B8;">or</div><div style="flex: 1; height: 1px; background: #E2E8F0;"></div></div>
      <button style="width: 100%; height: 54px; border: 2px solid #E2E8F0; border-radius: 13px; background: #FFFFFF; color: #0F172A; padding: 0 18px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/></svg><span>Type it in</span></button>
      <div style="text-align: center; font-size: 13.5px; font-weight: 600; color: #64748B; padding-top: 2px;">Have a spreadsheet? <a href="#" style="color: #047857; text-decoration: underline; text-underline-offset: 3px;">Upload it</a></div>
    </div>
  </div>
  
</div>
</x-dc>
</body>
</html>
