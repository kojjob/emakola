<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #059669; } a:hover { color: #047857; }
    * { box-sizing: border-box; }
    input::placeholder, textarea::placeholder { color: #94A3B8; font-weight: 500; }
    button { font-family: inherit; }
    @keyframes ring { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes shimmer { 0% { opacity: .35; } 50% { opacity: .7; } 100% { opacity: .35; } }
    
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F8FAFC; color: #0F172A; display: flex; flex-direction: column; overflow: hidden;">
  
  <div style="height: 72px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(255,255,255,0.8); border-bottom: 1px solid rgba(226,232,240,0.8); backdrop-filter: blur(24px);">
    <button aria-label="Open sidebar" style="width: 36px; height: 36px; margin-left: -8px; border: 0; background: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
    <div style="flex: 1; position: relative;">
      <div style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg></div>
      <input type="search" placeholder="Search anything..." aria-label="Search" style="width: 100%; padding: 10px 16px 10px 40px; background: rgba(248,250,252,0.8); border: 1px solid #E2E8F0; border-radius: 12px; font-size: 14px; color: #334155; font-family: inherit; outline: none;" />
    </div>
    <button aria-label="Notifications" style="width: 36px; height: 36px; border: 0; background: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg></button>
    <div style="width: 36px; height: 36px; border-radius: 999px; background: #ECFDF5; color: #047857; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">A</div>
  </div>
  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;">


    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 16px 0;">
      <button aria-label="Back" style="width: 40px; height: 40px; margin-left: -8px; border: 0; background: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg></button>
      <div style="flex: 1; font-size: 17px; font-weight: 700; color: #0F172A;">Add products</div>
      <div style="font-size: 13px; font-weight: 800; color: #64748B; background: #F1F5F9; padding: 6px 12px; border-radius: 999px; font-variant-numeric: tabular-nums;">2 of 3</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 2px;">
      <div style="position: relative; width: 60px; height: 60px; border-radius: 14px; overflow: hidden; flex-shrink: 0;"><img src="eggs.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; " /><div style="position: absolute; right: 4px; bottom: 4px; width: 20px; height: 20px; border-radius: 999px; background: #059669; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.75l6 6 9-13.5"/></svg></div></div><div style="position: relative; width: 60px; height: 60px; border-radius: 14px; overflow: hidden; outline: 3px solid #059669; outline-offset: 2px; flex-shrink: 0;"><img src="melon.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; " /></div><div style="width: 60px; height: 60px; border-radius: 14px; overflow: hidden; opacity: 0.45; flex-shrink: 0;"><img src="citrus.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; " /></div>
      <div style="width: 60px; height: 60px; border-radius: 14px; border: 2px dashed #CBD5E1; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5v15m7.5-7.5h-15"/></svg></div>
    </div>
    <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 18px;">
      <div style="position: relative; height: 150px; border-radius: 20px; overflow: hidden; background: #F1F5F9; box-shadow: 0 10px 30px rgba(15,23,42,0.12);"><img src="melon.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; " />
        <div style="position: absolute; left: 12px; bottom: 12px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.92); font-size: 14px; font-weight: 800; color: #0F172A;">Watermelon</div>
      </div>
      <div>
        <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: #0F172A;">How much?</h1>
        <p style="margin: 5px 0 0; font-size: 15px; color: #64748B;">One price. Sizes later.</p>
      </div>
      <div style="position: relative;">
        <div style="position: absolute; left: 16px; top: 0; height: 76px; display: flex; align-items: center; font-size: 22px; font-weight: 700; color: #64748B; pointer-events: none;">GH₵</div>
        <input type="text" inputmode="decimal" placeholder="0" value="15" style="width: 100%; height: 76px; border: 2px solid #E2E8F0; border-radius: 13px; padding: 0 15px 0 84px; font-size: 40px; font-weight: 800; color: #0F172A; background: #FFFFFF; font-family: inherit; outline: none; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;" />
        
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;"><button style="height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0F172A; font-size: 14.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg><span>Same as last: GH₵ 45</span></button></div>
    </div>
  </div>
  
  <div style="flex-shrink: 0; padding: 12px 16px 16px; background: rgba(255,255,255,0.95); border-top: 1px solid #E2E8F0; backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 10px;">
    <button style="width: 100%; height: 56px; border: 0; border-radius: 13px; background: #059669; color: #fff; padding: 0 24px; font-size: 16.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 5px 14px rgba(5,150,105,0.28);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg><span>Next photo</span></button>
  </div>
</div>
</x-dc>
</body>
</html>
