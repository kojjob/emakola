<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <style>
    body { margin: 0; background: #ffffff; font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #b98a1f; } a:hover { color: #8f6a14; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #8896ab; }
  </style>
</helmet>

<div style="width: 794px; height: 1000px; box-sizing: border-box; background: #eef1f5; color: #0f172a; padding: 44px 48px; display: flex; flex-direction: column; gap: 20px;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <span class="lbl">Business card &middot; 89 &times; 51 mm &middot; shown at 200%</span>
    <p style="margin: 0; font-size: 12px; color: #64748b;">Trim size 336 &times; 192 px at print scale. Add 3&nbsp;mm bleed on export; keep text inside the safe zone.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span class="lbl">Front</span>
    <div style="width: 672px; height: 384px; background: #ffffff; border-radius: 10px; box-shadow: 0 2px 12px rgba(12,21,38,0.10); padding: 44px 48px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <svg viewBox="0 0 64 64" width="44" height="44" role="img" aria-label="Makola.io mark">
          <circle cx="32" cy="32" r="26" fill="#d4a843"/>
          <path d="M31 11 C27 21 27 43 30 53" stroke="#0c1526" stroke-width="5" stroke-linecap="round" fill="none"/>
          <g stroke="#0c1526" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M26.5 17 L22.5 15.5"/><path d="M25.2 24 L20.8 23"/><path d="M24.8 31 L20.2 30.7"/><path d="M25 38 L20.6 38.5"/><path d="M26 45 L22 46.5"/>
            <path d="M34 17.5 L38 16"/><path d="M33 24.5 L37.3 23.6"/><path d="M32.7 31.5 L37 31.3"/><path d="M32.9 38.5 L37 39"/><path d="M33.8 45.5 L37.6 46.8"/>
          </g>
        </svg>
        <span style="font-size: 28px; font-weight: 800; font-stretch: 116%; letter-spacing: -0.02em; color: #0c1526;">Makola<span style="color: #b98a1f;">.io</span></span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: #0c1526;">[NAME]</span>
          <span style="font-size: 15px; color: #64748b;">[ROLE]</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px; text-align: right; font-size: 14px; color: #334155;">
          <span>[PHONE]</span>
          <span>[WHATSAPP]</span>
          <span style="font-weight: 700; color: #b98a1f;">makola.io</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span class="lbl">Back</span>
    <div style="width: 672px; height: 384px; background: #0c1526; border-radius: 10px; box-shadow: 0 2px 12px rgba(12,21,38,0.10); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
      <svg viewBox="0 0 64 64" width="150" height="150" role="img" aria-label="Makola.io mark">
        <circle cx="32" cy="32" r="26" fill="#d4a843"/>
        <path d="M31 11 C27 21 27 43 30 53" stroke="#0c1526" stroke-width="5" stroke-linecap="round" fill="none"/>
        <g stroke="#0c1526" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M26.5 17 L22.5 15.5"/><path d="M25.2 24 L20.8 23"/><path d="M24.8 31 L20.2 30.7"/><path d="M25 38 L20.6 38.5"/><path d="M26 45 L22 46.5"/>
          <path d="M34 17.5 L38 16"/><path d="M33 24.5 L37.3 23.6"/><path d="M32.7 31.5 L37 31.3"/><path d="M32.9 38.5 L37 39"/><path d="M33.8 45.5 L37.6 46.8"/>
        </g>
      </svg>
      <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #8896ab;">Sell. Get paid. Grow.</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
