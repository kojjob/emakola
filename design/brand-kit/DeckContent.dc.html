<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <style>
    body { margin: 0; background: #ffffff; font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #b98a1f; } a:hover { color: #8f6a14; }
  </style>
</helmet>

<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #ffffff; color: #0f172a; padding: 64px 96px 56px; display: flex; flex-direction: column; gap: 36px;">

  <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #d4a843; padding-bottom: 20px;">
    <h1 style="margin: 0; font-size: 38px; font-weight: 800; font-stretch: 116%; letter-spacing: -0.02em; color: #0c1526;">[SLIDE TITLE]</h1>
    <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true">
      <circle cx="32" cy="32" r="26" fill="#d4a843"/>
      <path d="M31 12 C27 22 27 42 30 52" stroke="#0c1526" stroke-width="6" stroke-linecap="round" fill="none"/>
      <g stroke="#0c1526" stroke-width="3.6" stroke-linecap="round" fill="none"><path d="M26 19 L21 17.3"/><path d="M24.8 28 L19.8 27.4"/><path d="M25 37.5 L20.2 38"/><path d="M26.3 46.5 L22 48"/><path d="M34.4 19.5 L39 18"/><path d="M33.2 28.5 L38 28"/><path d="M33 38 L37.6 38.6"/><path d="M34 47 L38 48.4"/></g>
    </svg>
  </div>

  <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px;">
    <div style="display: flex; flex-direction: column; gap: 22px; justify-content: center;">
      <div style="display: flex; gap: 14px; align-items: flex-start;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #d4a843; margin-top: 8px; flex-shrink: 0;"></span>
        <span style="font-size: 21px; line-height: 1.5; color: #334155;">[POINT ONE — keep each to a single line of thought]</span>
      </div>
      <div style="display: flex; gap: 14px; align-items: flex-start;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #d4a843; margin-top: 8px; flex-shrink: 0;"></span>
        <span style="font-size: 21px; line-height: 1.5; color: #334155;">[POINT TWO]</span>
      </div>
      <div style="display: flex; gap: 14px; align-items: flex-start;">
        <span style="width: 10px; height: 10px; border-radius: 50%; background: #d4a843; margin-top: 8px; flex-shrink: 0;"></span>
        <span style="font-size: 21px; line-height: 1.5; color: #334155;">[POINT THREE]</span>
      </div>
    </div>
    <div style="border: 1.5px dashed #cbd5e1; border-radius: 16px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 15px; color: #94a3b8;">[VISUAL — screenshot, chart or photo]</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #e2e8f0; padding-top: 16px;">
    <span style="font-size: 13px; font-weight: 700; color: #0c1526;">Makola<span style="color: #b98a1f;">.io</span></span>
    <span style="font-size: 13px; color: #94a3b8;">[PAGE]</span>
  </div>

</div>
</x-dc>
</body>
</html>
