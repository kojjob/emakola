<!doctype html>
<html>

<body>
<x-dc>
<helmet>

  </div>

  <div style="background: #ffffff; border-radius: 12px; box-shadow: 0 2px 10px rgba(12,21,38,0.08); padding: 28px 32px;">

      <td style="padding-right: 18px; vertical-align: middle;">
        <svg viewBox="0 0 64 64" width="46" height="46" role="img" aria-label="Makola.io mark">

          <path d="M31 11 C27 21 27 43 30 53" stroke="#0c1526" stroke-width="5" stroke-linecap="round" fill="none"/>

            <path d="M34 17.5 L38 16"/><path d="M33 24.5 L37.3 23.6"/><path d="M32.7 31.5 L37 31.3"/><path d="M32.9 38.5 L37 39"/><path d="M33.8 45.5 L37.6 46.8"/>
          </g>
        </svg>
      </td>
      <td style="border-left: 2px solid #d4a843; padding-left: 18px; vertical-align: middle;">
        <div style="font-size: 16px; font-weight: 700; color: #0c1526;">[NAME]</div>
        <div style="font-size: 13px; color: #64748b; padding-top: 2px;">[ROLE] &middot; Makola<span style="color: #b98a1f;">.io</span></div>
        <div style="font-size: 12px; color: #64748b; padding-top: 8px;">[PHONE] &middot; [WHATSAPP]</div>
        <div style="font-size: 12px; padding-top: 2px;"><a href="https://makola.io" style="color: #b98a1f; font-weight: 700; text-decoration: none;">makola.io</a></div>
      </td>
    </tr></table>
  </div>

</div>
