<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <style>
    body { margin: 0; background: #ffffff; font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #b98a1f; } a:hover { color: #8f6a14; }
  </style>
</helmet>

<div style="width: 420px; height: 740px; box-sizing: border-box; background: #f8fafc; padding: 24px; display: flex;">
  <div style="flex: 1; background: #ffffff; border-radius: 16px; box-shadow: 0 2px 12px rgba(12,21,38,0.08); padding: 30px 28px; display: flex; flex-direction: column; gap: 20px; color: #0f172a;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
      <svg viewBox="0 0 64 64" width="52" height="52" role="img" aria-label="Makola.io mark">
        <circle cx="32" cy="32" r="26" fill="#d4a843"/>
        <path d="M31 11 C27 21 27 43 30 53" stroke="#0c1526" stroke-width="5" stroke-linecap="round" fill="none"/>
        <g stroke="#0c1526" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M26.5 17 L22.5 15.5"/><path d="M25.2 24 L20.8 23"/><path d="M24.8 31 L20.2 30.7"/><path d="M25 38 L20.6 38.5"/><path d="M26 45 L22 46.5"/>
          <path d="M34 17.5 L38 16"/><path d="M33 24.5 L37.3 23.6"/><path d="M32.7 31.5 L37 31.3"/><path d="M32.9 38.5 L37 39"/><path d="M33.8 45.5 L37.6 46.8"/>
        </g>
      </svg>
      <div style="font-size: 17px; font-weight: 800; color: #0c1526;">[SHOP NAME]</div>
      <div style="font-size: 12px; color: #64748b;">Receipt [RECEIPT NO.] &middot; [DATE]</div>
    </div>

    <div style="background: #ecfdf5; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>
      <div style="font-size: 40px; font-weight: 800; color: #06301a; font-variant-numeric: tabular-nums;">GH₵ 168.00</div>
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #059669;">Paid</div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155;"><span>[ITEM — sample]</span><span style="font-variant-numeric: tabular-nums;">GH₵ 120.00</span></div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155;"><span>[ITEM — sample]</span><span style="font-variant-numeric: tabular-nums;">GH₵ 40.00</span></div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px; color: #334155;"><span>Delivery</span><span style="font-variant-numeric: tabular-nums;">GH₵ 8.00</span></div>
      <div style="display: flex; justify-content: space-between; padding: 12px 0 0; font-size: 15px; font-weight: 800; color: #0c1526;"><span>Total</span><span style="font-variant-numeric: tabular-nums;">GH₵ 168.00</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #64748b;">
      <span>Paid via [PAYMENT METHOD]</span>
      <span>Ref [PAYMENT REFERENCE]</span>
    </div>

    <div style="margin-top: auto; border-top: 1px dashed #cbd5e1; padding-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <span style="font-size: 12px; color: #8896ab;">Powered by</span>
      <span style="font-size: 13px; font-weight: 800; color: #0c1526;">Makola<span style="color: #b98a1f;">.io</span></span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
