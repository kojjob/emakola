<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #059669; } a:hover { color: #047857; }
  </style>
</helmet>
<div style="width: 900px; padding: 28px; background: #f8fafc; box-sizing: border-box;">
  <!-- Notification settings: pictures per event, big switches, plain words -->
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden;">
    <div style="padding: 18px 24px 12px;">
      <div style="font-size: 16px; font-weight: 800; color: #0f172a;">What Makola tells you about</div>
      <div style="font-size: 12.5px; color: #64748b; margin-top: 2px;">Orders, payouts and identity checks always reach you — those cannot be turned off.</div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-top: 1px solid #f1f5f9;">
      <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #ECFDF5; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h8m-8 4h5M21 12c0 4-4 7-9 7-1.2 0-2.3-.16-3.3-.46L4 20l1.3-3.1C4 15.6 3 13.9 3 12c0-4 4-7 9-7s9 3 9 7z"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 14px; font-weight: 700; color: #0f172a;">A buyer writes to you</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="display: flex; align-items: center; gap: 5px; background: #059669; color: #ffffff; font-size: 11.5px; font-weight: 700; padding: 7px 14px; border-radius: 999px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          In app
        </div>
        <div style="display: flex; align-items: center; gap: 5px; background: #059669; color: #ffffff; font-size: 11.5px; font-weight: 700; padding: 7px 14px; border-radius: 999px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          SMS
        </div>
        <div style="background: #ffffff; border: 1px solid #e2e8f0; color: #94a3b8; font-size: 11.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px;">Email</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 24px; border-top: 1px solid #f1f5f9;">
      <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #fef3c7; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 13H7L6 8zm3 0V6a3 3 0 016 0v2"/><path d="M9.5 13.5l5 5m0-5l-5 5"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 700; color: #0f172a;">An item runs low</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="display: flex; align-items: center; gap: 5px; background: #059669; color: #ffffff; font-size: 11.5px; font-weight: 700; padding: 7px 14px; border-radius: 999px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          In app
        </div>
        <div style="background: #ffffff; border: 1px solid #e2e8f0; color: #94a3b8; font-size: 11.5px; font-weight: 600; padding: 7px 14px; border-radius: 999px;">SMS</div>
        <div style="display: flex; align-items: center; gap: 5px; background: #059669; color: #ffffff; font-size: 11.5px; font-weight: 700; padding: 7px 14px; border-radius: 999px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          Email
        </div>
      </div>
    </div>
  </div>

  <!-- Quiet hours -->
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px 24px; margin-top: 14px; display: flex; align-items: center; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #0f172a; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 14px; font-weight: 800; color: #0f172a;">Quiet hours</div>
      <div style="font-size: 12px; color: #64748b; margin-top: 1px;">No sounds or SMS while you sleep. Orders still arrive in the app.</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 700; color: #0f172a;">21:00</div>
      <span style="color: #94a3b8; font-weight: 600;">to</span>
      <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 700; color: #0f172a;">06:00</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
