<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #059669; } a:hover { color: #047857; }
  </style>
</helmet>
<div style="width: 1200px; padding: 28px; background: #f8fafc; box-sizing: border-box;">

  <!-- ═══ Setup journey card ═══ -->
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden;">

    <!-- Header: ring + words + segmented track -->
    <div style="display: flex; align-items: center; gap: 20px; padding: 22px 26px 18px;">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="27" fill="none" stroke="#e2e8f0" stroke-width="7"/>
        <circle cx="32" cy="32" r="27" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round"
                stroke-dasharray="169.6" stroke-dashoffset="101.8" transform="rotate(-90 32 32)"/>
        <text x="32" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" font-family="Inter, sans-serif">2/5</text>
        <text x="32" y="43" text-anchor="middle" font-size="8.5" font-weight="600" fill="#94a3b8" font-family="Inter, sans-serif">done</text>
      </svg>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 19px; font-weight: 800; color: #0f172a; letter-spacing: -0.01em;">Set up your shop</div>
        <div style="font-size: 13.5px; color: #64748b; margin-top: 3px;">5 small steps. Do one now.</div>
      </div>
      <div style="display: flex; align-items: center; gap: 5px;">
        <div style="width: 34px; height: 7px; border-radius: 999px; background: #059669;"></div>
        <div style="width: 34px; height: 7px; border-radius: 999px; background: #059669;"></div>
        <div style="width: 34px; height: 7px; border-radius: 999px; background: #e2e8f0;"></div>
        <div style="width: 34px; height: 7px; border-radius: 999px; background: #e2e8f0;"></div>
        <div style="width: 34px; height: 7px; border-radius: 999px; background: #e2e8f0;"></div>
      </div>
    </div>

    <!-- Step tiles -->
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; padding: 4px 26px 24px;">

      <!-- Done -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 16px; border-radius: 14px; background: #ECFDF5; border: 1px solid #a7f3d0; text-align: center;">
        <div style="position: relative;">
          <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: #ffffff;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 019 9c0 1.66-1.34 2-3 2h-2a2 2 0 00-2 2c0 1 .5 1.5.5 2.5S13.5 21 12 21"/><circle cx="8" cy="10" r="1.2" fill="#059669"/><circle cx="12" cy="7.5" r="1.2" fill="#059669"/><circle cx="16" cy="10" r="1.2" fill="#059669"/></svg>
          </div>
          <div style="position: absolute; right: -6px; top: -6px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; background: #059669; border: 2.5px solid #ECFDF5;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </div>
        </div>
        <div style="font-size: 13.5px; font-weight: 700; color: #047857;">Pick a look</div>
        <div style="font-size: 11.5px; font-weight: 600; color: #059669;">Done</div>
      </div>

      <!-- Done -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 16px; border-radius: 14px; background: #ECFDF5; border: 1px solid #a7f3d0; text-align: center;">
        <div style="position: relative;">
          <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: #ffffff;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3.3 8.3L12 13l8.7-4.7M12 13v8"/></svg>
          </div>
          <div style="position: absolute; right: -6px; top: -6px; display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; background: #059669; border: 2.5px solid #ECFDF5;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </div>
        </div>
        <div style="font-size: 13.5px; font-weight: 700; color: #047857;">Add one product</div>
        <div style="font-size: 11.5px; font-weight: 600; color: #059669;">Done</div>
      </div>

      <!-- Next: the one loud tile -->
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 14px; border-radius: 14px; background: #ffffff; border: 2px solid #059669; box-shadow: 0 8px 20px rgba(5,150,105,0.18); text-align: center;">
        <div style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #059669; color: #ffffff; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px;">Do this now</div>
        <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: #ECFDF5; margin-top: 4px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V7h11v10H3zm11-6h4l3 3v3h-7M5.5 20a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6zm11 0a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z"/></svg>
        </div>
        <div style="font-size: 13.5px; font-weight: 700; color: #0f172a;">Set where you deliver</div>
        <div style="display: flex; align-items: center; gap: 6px; background: #059669; color: #ffffff; font-size: 12.5px; font-weight: 700; padding: 8px 16px; border-radius: 10px; box-shadow: 0 2px 6px rgba(5,150,105,0.3);">
          Start
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
        </div>
      </div>

      <!-- Todo -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 16px; border-radius: 14px; background: #ffffff; border: 1px solid #e2e8f0; text-align: center;">
        <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: #f1f5f9;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h8m-8 4h5M21 12c0 4-4 7-9 7-1.2 0-2.3-.16-3.3-.46L4 20l1.3-3.1C4 15.6 3 13.9 3 12c0-4 4-7 9-7s9 3 9 7z"/></svg>
        </div>
        <div style="font-size: 13.5px; font-weight: 700; color: #334155;">Connect WhatsApp</div>
        <div style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #475569;">
          Add number
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
        </div>
      </div>

      <!-- Todo -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 16px; border-radius: 14px; background: #ffffff; border: 1px solid #e2e8f0; text-align: center;">
        <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: #f1f5f9;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.2 10.8l7-4M8.2 13.2l7 4"/></svg>
        </div>
        <div style="font-size: 13.5px; font-weight: 700; color: #334155;">Link your socials</div>
        <div style="display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #475569;">
          Add links
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Daily tasks card, calm empty state ═══ -->
  <div style="display: flex; align-items: center; gap: 16px; margin-top: 18px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px 26px;">
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: #ECFDF5;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
    </div>
    <div style="flex: 1;">
      <div style="font-size: 14.5px; font-weight: 700; color: #0f172a;">Nothing waiting today</div>
      <div style="font-size: 12.5px; color: #64748b; margin-top: 2px;">New orders and questions show here.</div>
    </div>
    <div style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8;">Do these now</div>
  </div>
</div>
</x-dc>
</body>
</html>
