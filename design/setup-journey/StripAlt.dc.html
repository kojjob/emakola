<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #059669; } a:hover { color: #047857; }
  </style>
</helmet>
<div style="width: 1200px; padding: 28px; background: #f8fafc; box-sizing: border-box;">
  <!-- Alternate: tinted wash card, no tracker — closer to today's strip -->
  <div style="position: relative; overflow: hidden; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 22px 26px;">
    <div style="position: absolute; inset: 0; background: linear-gradient(115deg, rgba(236,253,245,0.85), rgba(255,255,255,0) 50%);"></div>
    <div style="position: relative; display: flex; align-items: center; gap: 20px;">
      <svg width="62" height="62" viewBox="0 0 64 64" style="flex-shrink: 0;">
        <circle cx="32" cy="32" r="27" fill="none" stroke="#e2e8f0" stroke-width="7"/>
        <circle cx="32" cy="32" r="27" fill="none" stroke="#059669" stroke-width="7" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="101.8" transform="rotate(-90 32 32)"/>
        <text x="32" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" font-family="Inter, sans-serif">2/5</text>
        <text x="32" y="43" text-anchor="middle" font-size="8.5" font-weight="600" fill="#94a3b8" font-family="Inter, sans-serif">done</text>
      </svg>
      <div style="min-width: 0;">
        <div style="font-size: 17px; font-weight: 800; color: #0f172a;">Set up your shop</div>
        <div style="font-size: 13px; color: #64748b; margin-top: 2px;">One step at a time. This one next:</div>
      </div>
      <div style="flex: 1;"></div>
      <div style="display: flex; align-items: center; gap: 14px; background: #ffffff; border: 1px solid #a7f3d0; border-radius: 14px; padding: 12px 16px; box-shadow: 0 8px 20px rgba(5,150,105,0.12);">
        <div style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 4px 10px rgba(5,150,105,0.3);">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V7h11v10H3zm11-6h4l3 3v3h-7M5.5 20a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6zm11 0a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z"/></svg>
        </div>
        <div>
          <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #059669;">Do this now</div>
          <div style="font-size: 14.5px; font-weight: 800; color: #0f172a;">Set where you deliver</div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; background: #059669; color: #ffffff; font-size: 13px; font-weight: 700; padding: 10px 20px; border-radius: 10px; margin-left: 10px;">
          Start
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>
    <div style="position: relative; display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;">
      <span style="display: inline-flex; align-items: center; gap: 7px; background: #ECFDF5; color: #047857; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 999px; text-decoration: line-through;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        Pick a look
      </span>
      <span style="display: inline-flex; align-items: center; gap: 7px; background: #ECFDF5; color: #047857; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 999px; text-decoration: line-through;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        Add one product
      </span>
      <span style="display: inline-flex; align-items: center; gap: 7px; border: 1px solid #e2e8f0; background: #ffffff; color: #475569; font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 999px;">
        <span style="width: 13px; height: 13px; border-radius: 999px; border: 2px solid #cbd5e1; display: inline-block;"></span>
        Connect WhatsApp
      </span>
      <span style="display: inline-flex; align-items: center; gap: 7px; border: 1px solid #e2e8f0; background: #ffffff; color: #475569; font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 999px;">
        <span style="width: 13px; height: 13px; border-radius: 999px; border: 2px solid #cbd5e1; display: inline-block;"></span>
        Link your socials
      </span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
