<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #059669; } a:hover { color: #047857; }
  </style>
</helmet>
<div style="width: 390px; padding: 16px; background: #f8fafc; box-sizing: border-box;">
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 15.5px; font-weight: 800; color: #0f172a;">Set up your shop</div>
      <div style="background: #ECFDF5; color: #047857; font-size: 11.5px; font-weight: 700; padding: 4px 12px; border-radius: 999px;">2/5</div>
    </div>

    <!-- Vertical tracker, like order tracking -->
    <div style="position: relative; margin-top: 16px;">
      <div style="position: absolute; left: 19px; top: 12px; bottom: 12px; width: 4px; border-radius: 999px; background: #e2e8f0;"></div>
      <div style="position: absolute; left: 19px; top: 12px; height: 36%; width: 4px; border-radius: 999px; background: #059669;"></div>

      <div style="position: relative; display: flex; align-items: center; gap: 14px; padding: 7px 0;">
        <div style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 999px; background: #059669; border: 3px solid #ffffff; box-shadow: 0 0 0 1px #a7f3d0; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        </div>
        <div style="font-size: 13.5px; font-weight: 700; color: #047857; text-decoration: line-through;">Pick a look</div>
      </div>

      <div style="position: relative; display: flex; align-items: center; gap: 14px; padding: 7px 0;">
        <div style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 999px; background: #059669; border: 3px solid #ffffff; box-shadow: 0 0 0 1px #a7f3d0; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        </div>
        <div style="font-size: 13.5px; font-weight: 700; color: #047857; text-decoration: line-through;">Add one product</div>
      </div>

      <div style="position: relative; display: flex; align-items: center; gap: 14px; padding: 7px 0;">
        <div style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 999px; background: #ECFDF5; border: 3px solid #ffffff; box-shadow: 0 0 0 2px #059669, 0 6px 14px rgba(5,150,105,0.25); flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V7h11v10H3zm11-6h4l3 3v3h-7M5.5 20a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6zm11 0a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z"/></svg>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 9.5px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #059669;">Do this now</div>
          <div style="font-size: 14px; font-weight: 800; color: #0f172a;">Set where you deliver</div>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; background: #059669; color: #ffffff; font-size: 12.5px; font-weight: 700; padding: 10px 16px; border-radius: 10px; flex-shrink: 0;">
          Start
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
        </div>
      </div>

      <div style="position: relative; display: flex; align-items: center; gap: 14px; padding: 7px 0;">
        <div style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 999px; background: #f1f5f9; border: 3px solid #ffffff; box-shadow: 0 0 0 1px #e2e8f0; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h8m-8 4h5M21 12c0 4-4 7-9 7-1.2 0-2.3-.16-3.3-.46L4 20l1.3-3.1C4 15.6 3 13.9 3 12c0-4 4-7 9-7s9 3 9 7z"/></svg>
        </div>
        <div style="font-size: 13.5px; font-weight: 600; color: #64748b;">Connect WhatsApp</div>
      </div>

      <div style="position: relative; display: flex; align-items: center; gap: 14px; padding: 7px 0;">
        <div style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 999px; background: #f1f5f9; border: 3px solid #ffffff; box-shadow: 0 0 0 1px #e2e8f0; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.2 10.8l7-4M8.2 13.2l7 4"/></svg>
        </div>
        <div style="font-size: 13.5px; font-weight: 600; color: #64748b;">Link your socials</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
