<div style="width: 1200px; padding: 28px; background: #f8fafc; box-sizing: border-box;">

          <div style="width: 26px; height: 7px; border-radius: 999px; background: #e2e8f0;"></div>
        </div>
        <div style="font-size: 12.5px; font-weight: 700; color: #64748b;">2 of 5 done</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: #059669; color: #ffffff; font-size: 16px; font-weight: 800; padding: 16px 34px; border-radius: 13px; box-shadow: 0 8px 18px rgba(5,150,105,0.35); flex-shrink: 0;">
