<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #059669; } a:hover { color: #047857; }
  </style>
</helmet>
<div style="width: 1200px; padding: 28px; background: #f8fafc; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">

  <!-- ═══ Setup journey as a tracker ═══ -->
  <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px 28px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="min-width: 0; flex: 1;">
        <div style="font-size: 17px; font-weight: 800; color: #0f172a;">Set up your shop</div>
        <div style="font-size: 13px; color: #64748b; margin-top: 2px;">2 of 5 done. One step at a time.</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #ECFDF5; color: #047857; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        2/5
      </div>
    </div>

    <!-- Tracker -->
    <div style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 26px;">
      <!-- connecting line -->
      <div style="position: absolute; top: 26px; left: 10%; right: 10%; height: 4px; border-radius: 999px; background: #e2e8f0;"></div>
      <div style="position: absolute; top: 26px; left: 10%; width: 40%; height: 4px; border-radius: 999px; background: #059669;"></div>

      <!-- Done -->
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 999px; background: #059669; border: 4px solid #ffffff; box-shadow: 0 0 0 1px #a7f3d0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 700; color: #047857; text-align: center;">Pick a look</div>
      </div>

      <!-- Done -->
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 999px; background: #059669; border: 4px solid #ffffff; box-shadow: 0 0 0 1px #a7f3d0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 700; color: #047857; text-align: center;">Add one product</div>
      </div>

      <!-- Current -->
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 999px; background: #ECFDF5; border: 4px solid #ffffff; box-shadow: 0 0 0 2.5px #059669, 0 8px 18px rgba(5,150,105,0.25);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V7h11v10H3zm11-6h4l3 3v3h-7M5.5 20a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6zm11 0a1.8 1.8 0 100-3.6 1.8 1.8 0 000 3.6z"/></svg>
        </div>
        <div style="text-align: center;">
          <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: #059669;">Do this now</div>
          <div style="font-size: 13px; font-weight: 800; color: #0f172a; margin-top: 1px;">Set where you deliver</div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; background: #059669; color: #ffffff; font-size: 13px; font-weight: 700; padding: 10px 22px; border-radius: 10px; box-shadow: 0 4px 10px rgba(5,150,105,0.3);">
          Start
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>
        </div>
      </div>

      <!-- Todo -->
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 999px; background: #f1f5f9; border: 4px solid #ffffff; box-shadow: 0 0 0 1px #e2e8f0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h8m-8 4h5M21 12c0 4-4 7-9 7-1.2 0-2.3-.16-3.3-.46L4 20l1.3-3.1C4 15.6 3 13.9 3 12c0-4 4-7 9-7s9 3 9 7z"/></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 600; color: #64748b; text-align: center;">Connect WhatsApp</div>
      </div>

      <!-- Todo -->
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 999px; background: #f1f5f9; border: 4px solid #ffffff; box-shadow: 0 0 0 1px #e2e8f0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="M8.2 10.8l7-4M8.2 13.2l7 4"/></svg>
        </div>
        <div style="font-size: 12.5px; font-weight: 600; color: #64748b; text-align: center;">Link your socials</div>
      </div>
    </div>
  </div>

  <!-- ═══ All-clear, in the stat-card language ═══ -->
  <div style="position: relative; overflow: hidden; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px 24px; display: flex; align-items: center; gap: 16px;">
    <div style="position: absolute; inset: 0; background: linear-gradient(120deg, rgba(236,253,245,0.9), rgba(255,255,255,0) 55%);"></div>
    <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 6px 14px rgba(5,150,105,0.3);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
    </div>
    <div style="position: relative;">
      <div style="font-size: 15px; font-weight: 800; color: #0f172a;">Nothing to do — nice work</div>
      <div style="font-size: 12.5px; color: #64748b; margin-top: 2px;">New orders and questions show here.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
