# =============================================================================
# Emakola - Fly.io Configuration
# West Africa ecommerce platform
# =============================================================================

app = "emakola"
primary_region = "lhr"
kill_signal = "SIGTERM"
# Long enough for connection draining + Oban jobs to finish on shutdown.
kill_timeout = "60s"
swap_size_mb = 256

# -----------------------------------------------------------------------------
# Build configuration
# -----------------------------------------------------------------------------
[build]
  dockerfile = "Dockerfile"

# -----------------------------------------------------------------------------
# Non-secret environment variables
# -----------------------------------------------------------------------------
[env]
  PHX_HOST = "makola.io"
  PHX_SERVER = "true"
  ECTO_IPV6 = "true"
  POOL_SIZE = "10"
  LANG = "en_US.UTF-8"
  ERL_AFLAGS = "-proto_dist inet6_tcp"
  # BEAM clustering: rel/env.sh.eex sets RELEASE_DISTRIBUTION=name and
  # RELEASE_NODE from FLY_PRIVATE_IP; DNSCluster (lib/emakola/application.ex)
  # discovers peers via this 6PN DNS query.
  DNS_CLUSTER_QUERY = "emakola.internal"

# -----------------------------------------------------------------------------
# Deploy configuration
# Run migrations before each deploy
# -----------------------------------------------------------------------------
[deploy]
  release_command = "/app/bin/migrate"

# -----------------------------------------------------------------------------
# HTTP Service
# -----------------------------------------------------------------------------
[http_service]
  internal_port = 4000
  force_https = true
  # Carts are Postgres-backed (cart_items table), so a stopped or suspended
  # machine no longer wipes carts and multi-machine scaling is safe.
  # "suspend" is kept purely for faster wake-ups.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    # Benchmarked 2026-08-05: one shared-cpu-1x machine saturates dynamic
    # (storefront) rendering at ~70-80 req/s ≈ 100-150 concurrent connections.
    # The old soft_limit of 800 meant the proxy never woke the second machine
    # until far past single-machine saturation — under the load ladder, all
    # traffic piled onto one machine while the other stayed suspended.
    # soft_limit 100 makes the proxy spread/wake at the REAL knee, roughly
    # doubling usable capacity. hard_limit stays high as a backstop only.
    #
    # Re-benchmarked 2026-09-06 (docs/business-plan/server-capacity-benchmark.md):
    # the binding limit was memory, not CPU. Idle Bandit connection processes
    # kept ~0.9MB of garbage each, so a 512MB machine was OOM-killed at 160-250
    # live visitors while CPU sat under 30%. Fixed by collecting idle
    # connections (EmakolaWeb.IdleConnectionSweeper) and moving to 1GB below.
    hard_limit = 1000
    soft_limit = 100

  # NOTE: http_service.checks is an ARRAY of tables ([[...]]), not named
  # tables — fly rejects the config otherwise.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

    # Plug.SSL (force_ssl) sees rewrite_on: [:x_forwarded_proto]; sending
    # this header makes internal health probes look like HTTPS so they
    # are not 301-redirected.
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

# -----------------------------------------------------------------------------
# VM Resources
# -----------------------------------------------------------------------------
[[vm]]
  size = "shared-cpu-1x"
  # 1GB since 2026-09-06: the app is ~310MB before the first visitor (117MB of
  # compiled code), and production was swapping at idle on 512MB.
  memory = "1gb"
  cpus = 1

# -----------------------------------------------------------------------------
# Metrics (Fly.io Prometheus integration)
# -----------------------------------------------------------------------------
[metrics]
  port = 9091
  path = "/metrics"
