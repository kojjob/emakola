<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C1F17">
  <title>You're Offline - Makola</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #FAFAF9;
      color: #1C1917;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      text-align: center;
      max-width: 28rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3.5rem;
      height: 3.5rem;
      background-color: #0C1F17;
      border-radius: 0.75rem;
      margin-bottom: 2rem;
    }

    .logo svg {
      width: 1.75rem;
      height: 1.75rem;
    }

    .icon-offline {
      margin-bottom: 1.5rem;
    }

    .icon-offline svg {
      width: 4rem;
      height: 4rem;
      color: #A8A29E;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #0C1F17;
    }

    p {
      font-size: 1rem;
      color: #78716C;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #0C1F17;
      color: #FAFAF9;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-retry:hover {
      opacity: 0.85;
    }

    .btn-retry:active {
      opacity: 0.7;
    }

    .btn-retry svg {
      width: 1.125rem;
      height: 1.125rem;
    }

    .hint {
      margin-top: 2rem;
      font-size: 0.8125rem;
      color: #A8A29E;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Makola Logo -->
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FAFAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
    </div>

    <!-- Offline Icon -->
    <div class="icon-offline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <h1>You're offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Check your Wi-Fi or mobile data and try again.
    </p>

    <button class="btn-retry" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Try Again
    </button>

    <p class="hint">Makola will reconnect automatically when you're back online.</p>
  </div>

  <script>
    // Auto-retry when connection is restored
    window.addEventListener("online", function() {
      window.location.reload();
    });
  </script>
</body>
</html>
